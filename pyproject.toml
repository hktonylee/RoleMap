[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rolemap"
version = "0.1.0"
description = "Local SQLite career operations system"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rolemap = "role_map.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["role_map*"]
